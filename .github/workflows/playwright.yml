name: Playwright Tests

on:

  # Every Sunday at 10:00 PM IST
  schedule:
    - cron: '30 16 * * 0'

  # Automatically run regression when code is pushed
  push:
    branches:
      - feature/opportunity

  # Automatically run regression when PR is created/updated
  pull_request:
    branches:
      - main

  # Manual execution
  workflow_dispatch:
    inputs:

      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

      test_type:
        description: "Select Test Type"
        required: true
        type: choice
        options:
          - smoke
          - regression
          - all


jobs:

  test:

    name: Playwright Tests

    runs-on: ubuntu-latest

    # Manual run → selected environment
    # Automatic/Scheduled run → dev
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}

    # Environment secrets
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

    steps:

      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Display configuration
      - name: Display Configuration
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}"
          echo "Test Type: ${{ github.event_name == 'workflow_dispatch' && inputs.test_type || 'regression' }}"
          echo "BASE URL is configured: ${{ secrets.APP_BASE_URL != '' }}"

      # Push / PR → Regression
      - name: Run Automatic Regression Tests
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: npx playwright test --grep @regression

      # Sunday 10 PM IST → Full Test Suite
      - name: Run Full Test Suite
        if: ${{ github.event_name == 'schedule' }}
        run: npx playwright test

      # Manual → Smoke
      - name: Run Smoke Tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_type == 'smoke' }}
        run: npx playwright test --grep @smoke

      # Manual → Regression
      - name: Run Regression Tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_type == 'regression' }}
        run: npx playwright test --grep @regression

      # Manual → All
      - name: Run All Tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_type == 'all' }}
        run: npx playwright test

      # Upload screenshots, videos, traces
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

      # Upload HTML report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7