name: Playwright Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # 3. Check config file
      - name: Verify environment config
        run: |
          echo "Current directory:"
          pwd

          echo "Config folder:"
          ls -la config || true

          echo "Checking env.ts:"
          test -f config/env.ts && echo "env.ts FOUND" || echo "env.ts NOT FOUND"

          echo "Git tracked config files:"
          git ls-files config

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 6. Run Playwright tests
      - name: Run Playwright tests
        env:
          SB_BASE_URL: ${{ secrets.SB_BASE_URL }}
          SB_USERNAME: ${{ secrets.SB_USERNAME }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
        run: npx playwright test

      # 7. Upload Playwright report
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # 8. Upload test results
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
