name: Playwright Tests

on:
  workflow_dispatch:
    inputs:

      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

      test_type:
        description: "Select Test Type"
        required: true
        type: choice
        options:
          - smoke
          - regression
          - all

jobs:

  test:

    name: Playwright Tests

    runs-on: ubuntu-latest

    # Select GitHub Environment
    environment:
      name: ${{ inputs.environment }}

    # Get secrets from selected environment
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Display Test Configuration
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Test Type: ${{ inputs.test_type }}"
          echo "BASE URL is configured: ${{ secrets.APP_BASE_URL != '' }}"

      - name: Run Smoke Tests
        if: ${{ inputs.test_type == 'smoke' }}
        run: npx playwright test --grep @smoke

      - name: Run Regression Tests
        if: ${{ inputs.test_type == 'regression' }}
        run: npx playwright test --grep @regression

      - name: Run All Tests
        if: ${{ inputs.test_type == 'all' }}
        run: npx playwright test
